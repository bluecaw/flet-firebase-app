<!DOCTYPE html>
<html>
<head>
  <base href="%FLET_WEB_BASE_HREF%">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" import="A new Flet app.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユーザー管理アプリ</title>

  <style>
    /* 全画面の中央寄せ設定 */
    body {
      background-color: #0f172a; /* ダークな背景色 */
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    /* 🌪️ 嵐（渦）のアニメーションデザイン */
    .storm-spinner {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      /* 渦巻きのようなグラデーション */
      background: conic-gradient(from 0deg, transparent 0%, #38bdf8 50%, #818cf8 80%, #c084fc 100%);
      /* 中央をくり抜いてリング状にする */
      mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 0);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 10px), #000 0);
      animation: storm-spin 0.8s linear infinite;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
    }

    /* 回転アニメーション */
    @keyframes storm-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 24px;
      font-size: 16px;
      letter-spacing: 2px;
      color: #94a3b8;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1.0; }
    }
  </style>

  <!-- Flet Web 必須スクリプト -->
  <script>
    var flet_web_pyodide = true;
  </script>
  %FLET_WEB_ENTRYPOINT%
</head>
<body>
  <!-- 嵐のローディング要素 -->
  <div class="storm-spinner"></div>
  <div class="loading-text">LOADING...</div>
</body>
</html>
