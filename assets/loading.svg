<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- グラデーション定義 -->
    <linearGradient id="storm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- 背景（ダーク） -->
  <rect width="100%" height="100%" fill="none"/>

  <!-- 回転する嵐の円環 -->
  <g transform="translate(50,50)">
    <circle r="35" fill="none" stroke="url(#storm-grad)" stroke-width="8" stroke-dasharray="160 60" stroke-linecap="round">
      <!-- SVG内蔵の回転アニメーション -->
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        from="0" 
        to="360" 
        dur="0.8s" 
        repeatCount="indefinite" />
    </circle>
  </g>
</svg>
